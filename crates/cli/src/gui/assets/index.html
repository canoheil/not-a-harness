<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">nah 🐎</div>
      <select id="m-model" title="model (switching starts a fresh conversation)"></select>
      <div class="meta"><span id="m-server">…</span></div>
      <div class="spacer"></div>
      <div class="modes" id="modes" title="permission mode">
        <button data-mode="read-only">Read-Only</button>
        <button data-mode="confirm">Confirm</button>
        <button data-mode="auto">Auto</button>
      </div>
    </header>

    <nav class="toolbar">
      <button class="tb" id="tb-new" title="start a fresh conversation">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New chat</button>
      <button class="tb" id="tb-compact" title="summarize older history">
        <svg viewBox="0 0 16 16"><path d="M8 2v7M5 6l3 3 3-3M3 13h10"/></svg>Compact</button>
      <span class="tsep"></span>
      <button class="tb" id="tb-tools" title="enable or disable tools">
        <svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><rect x="9" y="9" width="4.5" height="4.5"/></svg>Tools</button>
      <button class="tb" id="tb-files" title="files the harness is holding">
        <svg viewBox="0 0 16 16"><path d="M2 4h4l1.5 2H14v7H2z"/></svg>Files</button>
      <button class="tb" id="tb-settings" title="provider, model, budget, root">
        <svg viewBox="0 0 16 16"><path d="M2 5h12M2 11h12"/><circle cx="6" cy="5" r="1.8"/><circle cx="10" cy="11" r="1.8"/></svg>Settings</button>
      <div class="spacer"></div>
      <span class="root" id="tb-root" title="project root"></span>
    </nav>

    <div id="chat"></div>

    <footer>
      <div class="status">
        <span id="s-stats"></span>
        <div class="ctxbar" title="context budget"><i id="s-ctx-fill" style="width:0%"></i></div>
        <span id="s-ctx">0 / 0 tokens</span>
        <div class="spacer"></div>
        <span id="s-busy"></span>
      </div>
      <div class="composer">
        <div class="input-wrap">
          <div class="palette" id="palette"></div>
          <textarea id="input" rows="1" placeholder="Ask nah to build something… (Enter to send · / for commands)"></textarea>
        </div>
        <button class="btn primary send" id="send">Send</button>
      </div>
    </footer>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-tabs">
        <button data-tab="settings" class="active">Settings</button>
        <button data-tab="tools">Tools</button>
        <button data-tab="files">Files</button>
      </div>
      <button class="btn ghost" id="drawer-close">✕</button>
    </div>

    <section class="pane" data-pane="settings">
      <label>Provider</label>
      <div class="row">
        <select id="cfg-provider">
          <option value="ollama">ollama</option>
          <option value="openai">openai</option>
        </select>
      </div>
      <label>Server URL</label>
      <div class="row">
        <input id="cfg-url" type="text" spellcheck="false">
      </div>
      <label>Model <small>(switching starts a fresh conversation)</small></label>
      <div class="row">
        <select id="cfg-model"></select>
        <button class="btn ghost" id="cfg-model-refresh" title="reload model list">⟳</button>
      </div>
      <label>Context budget (tokens)</label>
      <div class="row">
        <input id="cfg-ctx" type="number" min="512" step="256">
      </div>
      <label>History window (messages)</label>
      <div class="row">
        <input id="cfg-history" type="number" min="1" max="100">
      </div>
      <label>Project root</label>
      <div class="row">
        <input id="cfg-root" type="text" spellcheck="false">
      </div>
      <label class="check"><input id="cfg-autocompact" type="checkbox"> auto-compaction of old history</label>
      <div class="row">
        <button class="btn primary" id="cfg-apply">Apply</button>
        <span class="hint" id="cfg-hint"></span>
      </div>
    </section>

    <section class="pane" data-pane="tools" hidden>
      <div class="row">
        <button class="btn ghost" id="tools-reload">⟳ reload custom tools</button>
        <span class="hint" id="tools-hint"></span>
      </div>
      <div id="tools-list"></div>
    </section>

    <section class="pane" data-pane="files" hidden>
      <div id="files-list"></div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
