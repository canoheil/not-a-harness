[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/canoheil/not-a-harness"

# The whole product is intentionally dependency-free (std only):
# tiny binaries, no supply chain, fast CI builds.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
