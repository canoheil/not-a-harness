name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
        shell: bash

      - name: Build
        run: cargo build --release

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage=nah-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp target/release/nah "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          # stable alias so install.sh can use releases/latest/download/
          cp "$stage.tar.gz" "nah-${{ matrix.target }}.tar.gz"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          stage=nah-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp target/release/nah.exe "$stage/"
          cp README.md LICENSE "$stage/"
          7z a "$stage.zip" "$stage"
          # stable alias so install.ps1 can use releases/latest/download/
          cp "$stage.zip" "nah-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nah-${{ matrix.target }}
          path: nah-*.${{ matrix.archive }}

  build-desktop:
    name: desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: nah-desktop.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: nah-desktop
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: nah-desktop
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
        shell: bash

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Build desktop shell
        run: cargo build --release --manifest-path crates/desktop/Cargo.toml

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage=nah-desktop-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp crates/desktop/target/release/${{ matrix.exe }} "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          # stable alias so scripts can use releases/latest/download/
          cp "$stage.tar.gz" "nah-desktop-${{ matrix.target }}.tar.gz"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          stage=nah-desktop-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$stage"
          cp crates/desktop/target/release/${{ matrix.exe }} "$stage/"
          cp README.md LICENSE "$stage/"
          7z a "$stage.zip" "$stage"
          # stable alias so scripts can use releases/latest/download/
          cp "$stage.zip" "nah-desktop-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nah-desktop-${{ matrix.target }}
          path: nah-desktop-*.${{ matrix.archive }}

  release:
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
